name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: API (Java)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Banco real para o teste que sobe a aplicação e aplica as migrações do Flyway.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agendamento
          POSTGRES_USER: agendamento
          POSTGRES_PASSWORD: agendamento
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agendamento"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/agendamento
      DB_USER: agendamento
      DB_PASSWORD: agendamento

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Compilar e testar
        run: mvn -B -ntp verify 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Total de testes
        if: success()
        shell: bash
        run: grep -E "Tests run: [0-9]+, Failures" build.log | tail -1 | sed 's/^\[[A-Z]*\] */::notice title=Testes::/'
      # Mostra os erros de compilação e de teste no resumo da execução
      - name: Resumo dos erros
        if: failure()
        shell: bash
        run: |
          grep -E "^\[ERROR\] .*\.java" build.log | head -20 | sed 's/^/::error::/' || true
          grep -hE "Tests run:.*(Failures: [1-9]|Errors: [1-9])|<<< (FAILURE|ERROR)" build.log | head -20 | sed 's/^/::error::/' || true
          for f in target/surefire-reports/*.txt; do
            grep -A3 -E "<<< (FAILURE|ERROR)" "$f" | head -12 | tr '\n' ' ' | sed 's/^/::error::/'; echo
          done 2>/dev/null || true

  frontend:
    name: Front-end (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
