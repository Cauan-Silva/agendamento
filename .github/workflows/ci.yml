name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: API (Java)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Banco real para o teste que sobe a aplicação e aplica as migrações do Flyway.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agendamento
          POSTGRES_USER: agendamento
          POSTGRES_PASSWORD: agendamento
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agendamento"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/agendamento
      DB_USER: agendamento
      DB_PASSWORD: agendamento

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Compilar e testar
        run: mvn -B -ntp verify

  frontend:
    name: Front-end (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
